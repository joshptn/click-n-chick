map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $fastcgi_https {
    https   on;
    default off;
}

server {
    listen __PORT__ default_server;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 10m;

    # Render sits behind Cloudflare, which sets CF-Connecting-IP to the visitor
    # and overwrites any value the visitor sends. X-Forwarded-For is appended to,
    # not reset, so its entries can be forged. Every per-IP throttle relies on this.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header CF-Connecting-IP;

    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
